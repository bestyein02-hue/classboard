<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English · 진주동명고</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<link rel="manifest" href="https://bestyein02-hue.github.io/classboard/manifest.webmanifest" crossorigin="anonymous">
<link rel="icon" type="image/png" href="https://bestyein02-hue.github.io/classboard/icon-192.png">
<link rel="apple-touch-icon" href="https://bestyein02-hue.github.io/classboard/apple-touch-icon.png">
<meta name="theme-color" content="#E0601F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="English">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Nanum+Gothic:wght@400;700;800&family=Gowun+Dodum&family=Fredoka:wght@600&family=Noto+Sans+KR:wght@400;500;700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --paper:#F6F8FA; --sheet:#FFFFFF; --ink:#16212E; --muted:#5B6878; --line:#D9E0E8;
  --navy:#1A3A5C; --blue:#2E6DA4; --blue-soft:#E6EEF7; --green:#2F7D5B; --green-soft:#E7F3EC;
  --hl:#FFE58A; --hl-ink:#16212E; --red:#C2413A; --red-soft:#FBEAE8;
  --s:#2E6DA4; --v:#C2413A; --o:#2F7D5B; --c:#8A5A00; --m:#7A6E86; --x:#C2413A;
  --fs:1;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1722; --sheet:#16202D; --ink:#E8EEF5; --muted:#9AA8B8; --line:#2A3746;
    --navy:#9CC3EA; --blue:#7FB0E3; --blue-soft:#1C2C40; --green:#7DCBA4; --green-soft:#17302A;
    --hl:#6B5A12; --hl-ink:#FFF6D0; --red:#F08A82; --red-soft:#3A1F1E;
    --s:#7FB0E3; --v:#F08A82; --o:#7DCBA4; --c:#E3B861; --m:#B9AEC6; --x:#F08A82;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1722; --sheet:#16202D; --ink:#E8EEF5; --muted:#9AA8B8; --line:#2A3746;
  --navy:#9CC3EA; --blue:#7FB0E3; --blue-soft:#1C2C40; --green:#7DCBA4; --green-soft:#17302A;
  --hl:#6B5A12; --hl-ink:#FFF6D0; --red:#F08A82; --red-soft:#3A1F1E;
  --s:#7FB0E3; --v:#F08A82; --o:#7DCBA4; --c:#E3B861; --m:#B9AEC6; --x:#F08A82;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.en{font-family:Literata,Georgia,"Times New Roman",serif}
.hidden{display:none!important}
#app{height:100%;display:flex;flex-direction:column}

/* ---------- class board ---------- */
.bar{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--navy);color:#fff;flex-wrap:wrap}
.bar .ttl{flex:1;min-width:180px;display:flex;flex-direction:column;line-height:1.25}
.bar .ttl small{opacity:.75;font-size:13px}
.bar .ttl b{font-size:20px;font-weight:600}
.ib{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:10px;padding:7px 12px;font-size:15px;font-weight:500;min-height:42px}
.ib.solid{background:#fff;color:var(--navy);border-color:#fff}
.tabs{display:flex;gap:4px;padding:8px 18px;background:var(--sheet);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-size:16px;color:var(--muted);white-space:nowrap;font-weight:500}
.tab.on{background:var(--blue-soft);color:var(--navy);font-weight:700}
.stage{flex:1;overflow:auto;padding:28px 24px 24px}
.slide{max-width:1240px;margin:0 auto;font-size:calc(clamp(19px, 1.85vw, 34px) * var(--fs))}
.slide h2{font-size:1.15em;margin:0 0 .7em;color:var(--navy);font-weight:700;display:flex;align-items:baseline;gap:.5em;flex-wrap:wrap}
.slide h2 .kind{font-size:.62em;font-weight:600;color:var(--blue);background:var(--blue-soft);border-radius:6px;padding:.15em .55em}
.foot{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--sheet);border-top:1px solid var(--line)}
.nav{min-width:120px;min-height:56px;border-radius:14px;border:0;background:var(--navy);color:#fff;font-size:19px;font-weight:600}
.nav:disabled{opacity:.3;cursor:default}
.dots{flex:1;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);border:0;padding:0}
.dot.on{background:var(--blue);width:28px;border-radius:6px}
.count{font-size:15px;color:var(--muted);min-width:60px;text-align:center}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;opacity:.85}
.live i{width:9px;height:9px;border-radius:50%;background:#7DE0A6;display:inline-block}

@media (max-width:760px){.bar .hide-sm,.dots{display:none}.nav{min-width:0;flex:1}.foot{gap:8px}.bar{padding:8px 12px}.stage{padding:18px 14px}}
/* passage text */
.para{margin:0 0 .9em;line-height:1.85;text-align:left;hyphens:none}
.para .pn{font-family:"IBM Plex Sans KR",sans-serif;font-size:.6em;color:var(--blue);font-weight:700;margin-right:.4em;vertical-align:.25em}
mark.key{background:linear-gradient(transparent 38%,var(--hl) 38%);color:inherit;padding:0 .05em}
.sent{border-radius:4px;cursor:pointer;transition:background .15s}
.sent.lit{background:var(--blue-soft);box-shadow:0 0 0 2px var(--blue-soft)}
u{text-decoration-thickness:2px;text-underline-offset:4px}

/* structure */
.flow{display:flex;flex-direction:column;gap:0}
.flow{font-size:1em}
.blk{display:grid;grid-template-columns:6em 1fr;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sheet)}
.blk .lab{background:var(--navy);color:#fff;padding:.45em .7em;display:flex;flex-direction:column;justify-content:center;gap:.15em;font-weight:700}
.blk .lab small{font-weight:400;font-size:.65em;opacity:.85}
.blk .body{padding:.45em .9em}
.blk .body .ko{font-size:1em}
.blk .body .k{font-size:.85em;color:var(--muted);margin-top:.2em}
.blk.thesis{border-color:var(--hl)}
.blk.thesis .lab{background:var(--hl);color:var(--hl-ink)}
.arrow{align-self:center;color:var(--muted);font-size:.6em;line-height:1;padding:.3em 0}
.thesis-line{margin-top:1em;padding:.7em 1em;border-left:6px solid var(--hl);background:var(--sheet);border-radius:0 10px 10px 0}
.thesis-line .ko{display:block;font-size:.8em;color:var(--muted);margin-top:.3em}

/* vocab */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15em),1fr));gap:.55em}
.vc{background:var(--sheet);border:1.5px solid var(--line);border-radius:12px;padding:.55em .8em;cursor:pointer;text-align:left}
.vc .w{font-weight:600;font-size:1.02em}
.vc .m{font-size:.82em;margin-top:.15em}
.vc .x{font-size:.66em;color:var(--muted);margin-top:.2em}
.vc.cover .m{background:var(--line);color:transparent;border-radius:6px;user-select:none}
.vc.cover .x{visibility:hidden}

/* sentence */
.sx{background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:1em 1.1em;margin-bottom:.9em}
.sx .line{line-height:2.4}
.seg{border-bottom:4px solid var(--c1);padding-bottom:1px}
.seg sup{font-family:"IBM Plex Sans KR",sans-serif;font-size:.5em;font-weight:700;color:var(--c1);margin-right:.2em;vertical-align:.9em;letter-spacing:0}
.seg.S{--c1:var(--s)}.seg.V{--c1:var(--v)}.seg.O,.seg.IO,.seg.DO{--c1:var(--o)}.seg.C,.seg.OC{--c1:var(--c)}.seg.M{--c1:var(--m);border-bottom-style:dashed}
.seg.X{--c1:var(--x);background:var(--red-soft);border-radius:4px 4px 0 0}
.sx .ko{margin-top:.5em;font-size:.82em;color:var(--muted)}
.sx ul{margin:.6em 0 0;padding-left:1.1em;font-size:.78em}
.legend{display:flex;gap:1em;flex-wrap:wrap;font-size:.6em;color:var(--muted);margin-bottom:.8em}
.legend span{border-bottom:3px solid var(--c1);padding-bottom:1px}

/* question */
.q-stem{font-weight:600;margin-bottom:.6em}
.q-body{background:var(--sheet);border:1.5px solid var(--line);border-radius:12px;padding:.8em 1em;margin-bottom:.8em;line-height:1.8;font-size:.92em}
.chs{display:flex;flex-direction:column;gap:.4em}
.ch{display:flex;gap:.6em;align-items:flex-start;text-align:left;background:var(--sheet);border:1.5px solid var(--line);border-radius:12px;padding:.5em .8em;font-size:.9em;width:100%}
.ch .no{font-weight:700;color:var(--blue);min-width:1.4em}
.ch.pick{border-color:var(--blue);background:var(--blue-soft)}
.ch.right{border-color:var(--green);background:var(--green-soft)}
.ch.wrong{border-color:var(--red);background:var(--red-soft)}
.explain{margin-top:.8em;padding:.7em 1em;background:var(--green-soft);border-radius:12px;font-size:.82em}
.reveal-btn{margin-top:.8em;border:2px solid var(--green);color:var(--green);background:transparent;border-radius:12px;padding:.35em 1em;font-size:.8em;font-weight:600}

/* translate */
.tr{display:grid;grid-template-columns:1fr 1fr;gap:.4em 1.4em}
.tr .e{line-height:1.7}
.tr .k{font-size:.86em;line-height:1.7;border-left:3px solid var(--line);padding-left:.8em;cursor:pointer}
.tr .k.cover{color:transparent;background:var(--line);border-radius:6px;user-select:none}
.tr .row{display:contents}
@media (max-width:760px){.tr{grid-template-columns:1fr}.tr .k{margin-bottom:.6em}}

/* background box (worksheet style) */
.bgbox{border:2px solid var(--green);border-radius:12px;overflow:hidden}
.bgbox div{padding:.55em 1em;font-size:.88em}
.bgbox div:nth-child(odd){background:var(--green-soft)}
.bgbox div::before{content:"▸ ";color:var(--green);font-weight:700}

.imgwrap{text-align:center}
.imgwrap img{max-width:100%;max-height:62vh;border-radius:12px;border:1px solid var(--line)}
.imgwrap p{color:var(--muted);font-size:.82em}
.free{white-space:pre-wrap;line-height:1.8}

.empty{max-width:640px;margin:12vh auto;text-align:center;color:var(--muted);font-size:18px}
.empty b{display:block;color:var(--ink);font-size:24px;margin-bottom:.4em}

/* drawer & sheets */
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:20}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(400px,92vw);background:var(--sheet);z-index:21;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:4px 0 24px rgba(0,0,0,.2)}
.drawer h3{margin:16px 6px 6px;font-size:15px;color:var(--muted);font-weight:600}
.drawer .pi{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:10px;font-size:17px}
.drawer .pi small{display:block;color:var(--muted);font-size:13px}
.drawer .pi.on{background:var(--blue-soft);color:var(--navy);font-weight:600}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:21;background:var(--sheet);border-radius:18px;padding:24px;width:min(520px,92vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet h3{margin:0 0 8px;font-size:20px}
.sheet p{color:var(--muted);margin:6px 0 14px}
.code{font-size:64px;font-weight:700;letter-spacing:.15em;text-align:center;color:var(--navy);margin:6px 0}
.qr{display:flex;justify-content:center;margin:8px 0}
.qr img{width:180px;height:180px;image-rendering:pixelated;background:#fff;padding:8px;border-radius:8px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:9px 14px;font-weight:500;min-height:42px}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.warn{color:var(--red);border-color:var(--red)}
.btn.sm{padding:5px 10px;min-height:34px;font-size:14px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.inp{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 11px;width:100%}
textarea.inp{min-height:90px;resize:vertical;line-height:1.5}
.err{color:var(--red);font-size:14px;min-height:1.2em}
.sleep{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--paper);padding:10px 12px 10px 16px;border-radius:14px;display:flex;gap:12px;align-items:center;font-size:15px;max-width:92vw;box-shadow:0 8px 28px rgba(0,0,0,.3)}
.sleep .btn.pri{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.slide.fit{max-width:1500px;font-size:inherit}
.fit-box{font-size:30px}
.fit-box .para{line-height:1.6;margin:0 0 .6em}
.fit-box .flow{font-size:1em}
.mrow{display:grid;grid-template-columns:3.8em 1fr;gap:.5em;border-left:.28em solid transparent;border-radius:0 .5em .5em 0;padding:.2em .5em .2em .2em;margin-bottom:.12em;transition:background .3s,border-color .3s}
.mrow .mlab{font-family:"IBM Plex Sans KR",sans-serif;font-weight:700;font-size:.78em;align-self:center;text-align:center;line-height:1.2;color:transparent;transition:color .3s}
.mrow.on{background:var(--bs);border-left-color:var(--ba)}
.mrow.on .mlab{color:var(--ba)}
.mrow.th{--bs:var(--hl);--ba:#D9A400}
.mrow.th .mlab{color:var(--hl-ink)}
.mtxt{line-height:1.55}
:root{--b0:#2E6DA4;--b0s:#E6EEF7;--b1:#2F7D5B;--b1s:#E7F3EC;--b2:#B8650A;--b2s:#FBEFDD;--b3:#7A4FA3;--b3s:#F0E9F7;--b4:#1F7F86;--b4s:#E1F2F3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--b0:#7FB0E3;--b0s:#1C2C40;--b1:#7DCBA4;--b1s:#17302A;--b2:#E8A860;--b2s:#3A2A14;--b3:#C2A3E0;--b3s:#2D2238;--b4:#6CC6CC;--b4s:#14312F}}
:root[data-theme="dark"]{--b0:#7FB0E3;--b0s:#1C2C40;--b1:#7DCBA4;--b1s:#17302A;--b2:#E8A860;--b2s:#3A2A14;--b3:#C2A3E0;--b3s:#2D2238;--b4:#6CC6CC;--b4s:#14312F}
.rs{opacity:.3;transition:opacity .2s;cursor:pointer;border-radius:.18em}
.rs.done{opacity:.85}
.rs.cur{opacity:1;background:var(--blue-soft);box-shadow:0 0 0 .1em var(--blue-soft)}
.rpanel{position:fixed;left:50%;transform:translateX(-50%);width:min(1500px,94vw);max-height:46vh;overflow:auto;background:var(--sheet);border:2px solid var(--blue);border-radius:16px;padding:14px 20px;box-shadow:0 12px 40px rgba(0,0,0,.28);z-index:12;font-size:clamp(20px,2.1vw,34px)}
.rpanel .pk{font-weight:600;line-height:1.5;margin-bottom:.3em}
.rpanel .pv{margin:.2em 0}
.rpanel .chip{display:inline-flex;gap:.4em;align-items:baseline;background:var(--blue-soft);border-radius:999px;padding:.12em .8em;margin:.2em .4em .2em 0}
.rpanel .pa{line-height:2.3;margin:.2em 0}
.rpanel .pp{margin:.2em 0 0;padding-left:1.1em;font-size:.88em}
.rpanel .pe{color:var(--muted);font-size:.8em}
.task{text-align:center;padding-top:.4em}
.task .tk-t{font-weight:700;font-size:1.3em;line-height:1.35}
.task .tk-b{font-size:.9em;margin-top:.3em;color:var(--muted);white-space:pre-wrap}
.tm{font-size:3.2em;font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy);line-height:1.2;margin-top:.15em}
.tm.done{color:var(--red)}
.fit-box.free .ft{font-weight:700;font-size:1.25em;line-height:1.4;color:var(--navy);margin-bottom:.5em}
.fit-box.free .fb{line-height:1.75;white-space:pre-wrap}
.slide.draw{max-width:none}
.drawwrap{position:relative}
.drawwrap canvas{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;touch-action:none}
.dtools{position:absolute;top:10px;right:10px;display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.94);padding:6px 10px;border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:2}
.dtools .tg{color:#16212E;background:#fff;min-height:40px}
.dtools .tg.on{background:var(--green);color:#fff}
.dc{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #8a95a3;padding:0}
.dc.on{box-shadow:0 0 0 3px var(--blue)}
.dguide{position:absolute;top:10px;left:14px;font-weight:600;font-size:20px;color:#16212E;background:rgba(255,255,255,.94);border-radius:10px;padding:6px 14px;z-index:2;max-width:52%}
.foot .tools{flex:1;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.foot .tg{min-height:52px;font-size:18px;padding:8px 20px}
.tab{max-width:15em;overflow:hidden;text-overflow:ellipsis}
.gtchip{position:fixed;left:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--navy);color:#fff;border:0;border-radius:999px;padding:10px 22px;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 6px 22px rgba(0,0,0,.3)}
.gtchip.done{background:var(--red);color:#fff;animation:gtb .8s ease-in-out infinite alternate}
@keyframes gtb{from{transform:scale(1)}to{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){.gtchip.done{animation:none}}
.code.done{color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;z-index:40;font-size:15px}

/* ---------- admin ---------- */
.adm-top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--ink);color:var(--paper);flex-wrap:wrap}
.adm-top b{flex:1;font-size:17px}
.adm-top .seg-t{display:flex;background:rgba(255,255,255,.12);border-radius:10px;padding:3px}
.adm-top .seg-t button{border:0;background:transparent;color:inherit;padding:6px 14px;border-radius:8px;font-weight:500}
.adm-top .seg-t button.on{background:var(--paper);color:var(--ink)}
.adm-top .btn{background:transparent;color:inherit;border-color:rgba(127,140,155,.6)}
.adm{flex:1;overflow:hidden;display:grid;grid-template-columns:260px 250px 1fr}
.col{overflow:auto;border-right:1px solid var(--line);padding:12px}
.col h4{margin:4px 4px 8px;font-size:13px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.unit{margin-bottom:10px}
.unit-h{display:flex;align-items:center;gap:4px;padding:6px 4px;font-weight:700;color:var(--navy)}
.unit-h span{flex:1}
.li{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:9px;font-size:15px}
.li.on{background:var(--blue-soft);color:var(--navy);font-weight:600}
.li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .ty{font-size:12px;color:var(--blue);background:var(--blue-soft);padding:1px 7px;border-radius:6px;flex:none}

/* remote */

@media (max-width:760px){.nav{min-width:0;flex:1;font-size:18px;min-height:54px}.slide.fit{padding:18px 18px;border-radius:24px}.bar{padding:10px 14px 14px}.bar .ttl b{font-size:22px}.logo{width:38px;height:38px;font-size:22px}.foot{padding:6px 14px 12px}.tabs{padding:12px 14px 4px}.stage{padding:10px 14px 8px}}

.at{border:0;background:var(--paper);border-radius:20px;padding:6px 4px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:27px;line-height:1.1;color:var(--ink);box-shadow:var(--shadow)}
.at small{font-size:13px;color:var(--muted)}

/* ===================== 펭귄 문고판 + 모눈 노트: 주황 띠, 굵은 고딕 제목, 노란 형광펜, 포스트잇 이름표 ===================== */
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{
  color-scheme:light;
  --paper:#FBFBF8; --sheet:#FFFFFF; --inner:#FAFAF7; --ink:#1B1B1B; --muted:#5F5F5A; --line:#D9D6CE; --card-line:#E3E0D8; --on:#FFFFFF;
  --navy:#1B1B1B; --orange:#E0601F; --orange-dk:#B8491A; --blue:#E0601F; --blue-soft:#FDE7DA; --green:#E0601F; --green-soft:#FDE7DA;
  --hl:#FFE45C; --hl-ink:#1B1B1B; --red:#C62E2E; --red-soft:#FBE3E1;
  --s:#2F6FD0; --v:#C62E2E; --o:#1E8A5A; --c:#B8491A; --m:#7A4FB5; --x:#C62E2E;
  --b0:#FFE45C; --b0s:#FFF6C2; --b1:#FFC2DA; --b1s:#FFE7F0; --b2:#BDECD5; --b2s:#E3F7EE; --b3:#C6E0FF; --b3s:#E7F1FF; --b4:#FFD0B0; --b4s:#FFEADC;
  --dash:#B9B5AB; --grid:#E3EAF3; --shadow:none; --btn-ink:#1B1B1B;
  --f-serif:"Source Serif 4","Noto Serif KR",Georgia,serif;
  --f-hand:"Gamja Flower","Noto Sans KR",sans-serif;
  --f-ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-ko:var(--f-ui); --f-sans:var(--f-ui); --f-lab:var(--f-hand); --f-title:var(--f-ui);
}
html,body{background:var(--paper)}
body{font-family:var(--f-ui);color:var(--ink);font-size:19px;background-image:none}
.en,.para,.mtxt,.pa,.vc .w,.chip b,.k.en{font-family:var(--f-serif)}
.en,.para,.mtxt{font-weight:500}
.para{line-height:1.6}
.stage{font-family:var(--f-ko)}

/* 머리글: 펭귄 주황 띠 */
.bar{position:relative;background:var(--orange);color:#fff;padding:16px 32px;gap:8px 12px;box-shadow:none;border-bottom:0;align-items:center}
.bar::after{display:none}
.bar .ttl small{font-family:var(--f-ui);font-size:15px;font-weight:700;letter-spacing:.12em;color:#FFE9DC;opacity:1;text-transform:none}
.bar .ttl b{font-family:var(--f-ui);font-size:36px;font-weight:900;letter-spacing:-.02em;line-height:1.2;color:#fff}
.ib{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.75);border-radius:6px;padding:7px 15px;margin-left:0;font-family:var(--f-ui);font-size:18px;font-weight:700;letter-spacing:0;text-transform:none;min-height:46px;box-shadow:none}
.ib:hover{background:rgba(255,255,255,.12)}
.ib.on{background:#fff;color:var(--orange-dk);border-color:#fff}
.ib.solid{background:#fff;color:var(--orange-dk);border-color:#fff}
.live{color:#FFE9DC;font-family:var(--f-ui);font-size:14px;letter-spacing:0;text-transform:none}
.live i{background:#fff}

/* 탭: 흰 띠 + 주황 밑줄 */
.tabs{background:#fff;border-bottom:2px solid var(--ink);padding:0 32px;gap:26px}
.tab{background:transparent;color:#55554F;border:0;border-bottom:5px solid transparent;border-radius:0;padding:14px 2px 10px;margin:0 0 -2px;font-family:var(--f-ui);font-size:20px;font-weight:700;letter-spacing:0;text-transform:none;box-shadow:none;flex:none;max-width:16em;overflow:hidden;text-overflow:ellipsis}
.tab.on{color:var(--orange-dk);border-bottom-color:var(--orange);background:transparent}

/* 본문: 모눈 노트 위에 흰 종이 */
.stage{padding:22px 32px 12px;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.slide.fit{background:#fff;border:1px solid var(--card-line);border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.04);padding:28px 44px;max-width:1440px}
.slide.draw{background:transparent;border:0;padding:0;max-width:none;box-shadow:none}
.drawwrap{background:#fff;border:1px solid var(--card-line);border-radius:6px;box-shadow:none}
.dguide{font-family:var(--f-hand);font-weight:700;color:var(--ink)}
.fit-box>*:last-child,.fit-box .para:last-child{margin-bottom:0}

/* 아래 버튼 */
.foot{background:#fff;border-top:1px solid var(--card-line);padding:10px 32px;gap:16px}
.nav{min-width:170px;min-height:64px;border-radius:6px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-family:var(--f-ui);font-size:21px;font-weight:700;letter-spacing:0;text-transform:none;box-shadow:none}
.nav[data-act="next"]{background:var(--orange);border-color:var(--orange);color:#fff}
.nav:disabled{opacity:.3}
.dots{gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.on{width:30px;border-radius:6px;background:var(--orange)}
.count{font-family:var(--f-ui);font-size:17px;font-weight:700;letter-spacing:0;color:var(--muted)}
.tg{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:6px;font-family:var(--f-ui);font-weight:700;letter-spacing:0;text-transform:none;box-shadow:none;white-space:nowrap}
.tg.on{background:var(--orange);border-color:var(--orange);color:#fff}
.foot .tg{min-height:54px;font-size:18px;padding:8px 22px}

/* 형광펜 */
mark.key{background:none;color:inherit;text-decoration:underline;text-decoration-color:var(--orange);text-decoration-thickness:.12em;text-underline-offset:.2em;padding:0}
.rs{opacity:.4}
.rs.done{opacity:.92}
.rs.cur{opacity:1;background:linear-gradient(transparent 35%,var(--hl) 35%,var(--hl) 92%,transparent 92%);border-radius:0;box-shadow:none;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sent.lit{background:linear-gradient(transparent 35%,var(--hl) 35%,var(--hl) 92%,transparent 92%);border-radius:0;box-shadow:none}
.pn{color:var(--orange-dk);font-family:var(--f-ui)}

/* 구조 표시 (원문 위): 형광펜 띠 + 포스트잇 */
.mrow{border-left:0;border-radius:4px;padding:.22em .6em .22em .3em;grid-template-columns:4.4em 1fr;margin-bottom:.12em}
.mrow .mlab{font-family:var(--f-hand);font-weight:700;letter-spacing:0;text-transform:none;font-size:.78em;color:transparent;background:transparent;padding:.08em .3em;align-self:center;margin-top:0;text-align:center;border-radius:2px}
.mrow.on{background:var(--bs)}
.mrow.on .mlab{background:var(--ba);color:var(--ink);transform:rotate(-2deg);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.mrow.th{--bs:#FFF6C2;--ba:#FFE45C}

/* 구조도: 흰 종이 줄 + 포스트잇 이름표 */
.blk{border:1px solid var(--card-line);border-radius:4px;background:#fff;box-shadow:none;grid-template-columns:5.8em 1fr;overflow:visible}
.blk .lab{background:var(--b0);color:var(--ink);font-family:var(--f-hand);font-weight:700;font-size:1.25em;letter-spacing:0;text-transform:none;align-items:center;justify-content:center;text-align:center;padding:.35em .4em;margin:.35em .2em .35em .45em;border-radius:2px;transform:rotate(-2deg);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.blk.bc1 .lab{background:var(--b1);color:var(--ink)} .blk.bc2 .lab{background:var(--b2);color:var(--ink)} .blk.bc3 .lab{background:var(--b3);color:var(--ink)} .blk.bc4 .lab{background:var(--b4);color:var(--ink)}
.blk .body{background:transparent;padding:.55em .9em}
.blk .body .ko{font-family:var(--f-ko);font-weight:500;line-height:1.55}
.blk .body .k{color:var(--muted);font-family:var(--f-serif);font-style:italic;font-weight:400}
.blk.thesis{border-color:var(--orange)}
.blk.thesis .lab{background:var(--orange);color:#fff}
.arrow{color:var(--dash)}
.thesis-line{border:2px solid var(--orange);border-radius:4px;background:#fff;color:var(--ink)}
.thesis-line .ko{color:var(--muted);opacity:1}
.blk.blank{border:2px dashed var(--dash);background:#fff}
.blk.blank .body{background:transparent}
.blk.blank .lab{background:#EDEBE5;color:var(--muted)}
.blk.blank.hinted .body>*{visibility:visible}
.blk.blank.hinted .body .ko[data-h]{visibility:hidden}
.blk.blank.hinted.bc0 .lab{background:var(--b0);color:var(--ink)} .blk.blank.hinted.bc1 .lab{background:var(--b1);color:var(--ink)} .blk.blank.hinted.bc2 .lab{background:var(--b2);color:var(--ink)} .blk.blank.hinted.bc3 .lab{background:var(--b3);color:var(--ink)} .blk.blank.hinted.bc4 .lab{background:var(--b4);color:var(--ink)}
.blk.sum.blank.bc3 .lab{background:var(--b3);color:var(--ink)}
.blk.sum.blank.bc4 .lab{background:var(--b4);color:var(--ink)}
.thesis-line.blank{background:#fff;border:2px dashed var(--dash)}
.thesis-line.blank>*{visibility:hidden}

/* 카드·버튼·창 */
.vc{background:#fff;border:1px solid var(--card-line);border-radius:4px;box-shadow:none}
.ch{border-radius:4px;border-width:2px}
.rpanel{background:#fff;border:2px solid var(--ink);border-top:8px solid var(--orange);border-radius:4px;box-shadow:0 14px 40px rgba(0,0,0,.18);font-family:var(--f-ko)}
.rpanel .pk{font-family:var(--f-ko);font-weight:700;line-height:1.55}
.rpanel .chip{background:#FFF6C2;border:0;border-radius:2px;color:var(--ink);transform:rotate(-1deg)}
.sheet{border:2px solid var(--ink);border-top:8px solid var(--orange);border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.22)}
.sheet h3{font-family:var(--f-ui);font-weight:900}
.btn{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:6px;box-shadow:none;font-weight:700}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.warn{color:var(--red);background:#fff;border-color:var(--red)}
.drawer{border-radius:0}
.tm,.code{font-family:var(--f-ui);font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.tm.done,.code.done{color:var(--red)}
.task .tk-t,.fit-box.free .ft,.empty b{font-family:var(--f-ui);font-weight:900;color:var(--ink)}
.gtchip{background:var(--orange);color:#fff;font-family:var(--f-ui);font-weight:900;border:0;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
.gtchip.done{background:var(--red)}
.slide h2 .kind{background:#FFF6C2;color:var(--ink);font-family:var(--f-hand);letter-spacing:0;text-transform:none;border-radius:2px}
.sleep{border-radius:6px}
.at{border:2px solid var(--ink);background:#fff;box-shadow:none;border-radius:6px;color:var(--ink)}
.at small{font-family:var(--f-ui);font-size:12px;letter-spacing:0;text-transform:none;color:var(--ink)}
.at.on{background:var(--orange);border-color:var(--orange);color:#fff}
.at.on small{color:#fff}
.atools{border:2px solid var(--ink);border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.2)}
.asz button.on,.acol button.on{box-shadow:0 0 0 3px var(--orange)}

@media (max-width:760px){

}

.tl-sum{margin-top:.6em;font-family:var(--f-ui);font-weight:600;color:var(--muted)}
.pk-num{font-family:var(--f-ui);font-weight:900}
.pk-opt input[type=number]{border:2px solid var(--line);border-radius:10px}

.tlc button{border:2px solid var(--line);border-radius:10px;color:var(--btn-ink)}
.ch.tl-on{background:linear-gradient(90deg,#D3E3DA var(--p,0%),#fff var(--p,0%))}

/* 폰 리모컨 */

@media (max-width:760px){

/* 슬라이드별 글꼴 */
.slide.f-hand .fit-box,.slide.f-hand .fit-box *:not(.cv-sticker),.slide.f-hand h2,.slide.f-hand .q-stem,.slide.f-hand .ch,.slide.f-hand .tr,.slide.f-hand .tr *{font-family:var(--f-hand)!important;font-weight:700}

.slide:not(.fit).sz-s{font-size:calc(clamp(19px, 1.85vw, 34px) * var(--fs) * .85)}

/* 그림판 안내 문구: 글꼴·크기 */
.slide.f-hand .dguide{font-family:var(--f-hand)!important;font-weight:700}
.slide.f-serif .dguide{font-family:var(--f-serif)!important;font-weight:600}
.slide.f-sans .dguide{font-family:var(--f-ui)!important;font-weight:700}
.slide.sz-s .dguide{font-size:20px}
.slide.sz-m .dguide{font-size:32px}
.slide.sz-l .dguide{font-size:46px;max-width:80%}
.slide.sz-xl .dguide{font-size:64px;max-width:90%}
.bk-list{display:flex;flex-direction:column;gap:6px}
.bk-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}

/* 판서 슬라이드 */

const $ = (sel,root=document)=>root.querySelector(sel);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function inline(s){
  let h = esc(s);
  h = h.replace(/\*\*(.+?)\*\*/g,'<mark class="key">$1</mark>')
       .replace(/__(.+?)__/g,'<u>$1</u>')
       .replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,'$1<em>$2</em>')
       .replace(/\[\[(.+?)\]\]/g,'<b class="czans">$1</b>');
  return h;
}
function segs(s){
  // [S:..] [V:..] ... ; inner text may contain inline markup
  const re = /\[(S|V|O|IO|DO|C|OC|M|X):([^\]]+)\]/g;
  let out="", last=0, m;
  while((m=re.exec(s))){
    out += inline(s.slice(last,m.index));
    out += `<span class="seg ${m[1]}"><sup>${m[1]}</sup>${inline(m[2])}</span>`;
    last = re.lastIndex;
  }
  return out + inline(s.slice(last));
}
function splitSentences(p){
  const PH="\x01";
  let t=p.replace(/\b(Mr|Mrs|Ms|Dr|Prof|Jr|Sr|St|Mt|Ft|vs|etc|approx|no|No|pp|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Oct|Nov|Dec|Fig|vol|dept|est)\./g,(_,a)=>a+PH);
  t=t.replace(/\b([A-Z])\./g,(_,a)=>a+PH);
  const parts=t.match(/[^.!?]+(?:[.!?]+[\u201c\u201d')*_]*|$)(\s+|$)/g);
  return parts?parts.map(x=>x.replace(new RegExp(PH,"g"),".")).filter(x=>x.trim()):[p];
}
function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
async function sha(text){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function sortedUnits(){ return [...S.units].sort((a,b)=>(a.order??0)-(b.order??0)); }

function orphanPassages(){ const ids=new Set(S.units.map(u=>u.id)); return S.passages.filter(p=>!ids.has(p.unitId)); }
function allPassagesOrdered(){
  const out=[]; sortedUnits().forEach(u=>out.push(...passagesOf(u.id))); out.push(...orphanPassages()); return out;
}
function unitList(p){ return S.units.some(u=>u.id===p.unitId)?passagesOf(p.unitId):orphanPassages(); }
function getP(pid){ return S.passages.find(p=>p.id===pid); }
function unitName(id){ return (S.units.find(u=>u.id===id)||{}).title||"분류 없음"; }
const UIEN=(()=>{ try{ return localStorage.getItem("cb_ui")==="en"; }catch(e){ return false; } })();
function L(ko,en){ return UIEN?en:ko; }

const ICONS={note:"✍️",text:"📖",reading:"🔦",textmap:"🎨",structure:"🧩",task:"⏱️",free:"💬",draw:"✏️",vocab:"🔤",sentence:"🔍",question:"❓",translate:"🌏",background:"💡",image:"🖼️"};
function slideIcon(sl){ return ICONS[sl.type]||"📄"; }
function slideTitle(sl){ return sl.tab || (sl.title||"").replace(/\s*\n\s*/g," ") || TYPES[sl.type]?.name || "슬라이드"; }
const KO2EN={"원문":"Passage","문제를 풀어 보세요":"Solve","문장 읽기":"Close reading","구조 표시":"Structure map","구조도":"Structure","어휘":"Vocabulary","문장 분석":"Sentences","예시 문제":"Check","내용 일치":"Check","해석":"Translation","배경지식":"Background","이미지":"Image","큰 글씨":"Note","그림판":"Sketch","활동":"Activity"};
const EN_TYPE={note:"Notes",text:"Passage",reading:"Close reading",textmap:"Structure map",structure:"Structure",task:"Solve",free:"Note",draw:"Sketch",vocab:"Vocabulary",sentence:"Sentences",question:"Check",translate:"Translation",background:"Background",image:"Image"};
function uiName(sl){ if(!UIEN) return slideTitle(sl); if(sl.tab) return sl.tab; const t=(sl.title||"").replace(/\s*\n\s*/g," "); if(!t) return EN_TYPE[sl.type]||"Slide"; const m=t.match(/^문장 (\d+)$/); if(m) return "Sentence "+m[1]; return KO2EN[t]||t; }

/* ================= slide renderers ================= */
function plainS(x){ return String(x||"").replace(/\[(?:S|V|O|IO|DO|C|OC|M|X):/g,"").replace(/\((?:that|why|which|who|whom|when|where)\)\s*/gi,"").replace(/[\]*_]/g,"").replace(/\s+/g," ").trim().toLowerCase(); }
function sentInfo(P,i){
  const sl=P.slides||[], txt=sl.find(x=>x.type==="text"); if(!txt) return null;
  const sents=passageSentences(txt.paras||[]); if(i<0||i>=sents.length) return null;

  const tr=sl.find(x=>x.type==="translate"); let ko="";
  if(tr){ const pr=(tr.pairs||[]).find(p=>plainS(p.en).slice(0,28)===key); ko=pr?(pr.ko||""):""; if(!ko && (tr.pairs||[]).length===sents.length) ko=tr.pairs[i].ko||""; }

  };

  const rd=sl.find(x=>x.type==="reading")||{}, xp=(rd.xpts||{})[i]||[];

}
function readingPanel(info,R){

  if(R.vc) h+= info.vocab.length ? `<div class="pv">${info.vocab.map(v=>`<span class="chip"><b class="en">${esc(v.w)}</b> ${esc(v.m||"")}</span>`).join("")}</div>` : `<div class="pe">${L("이 문장에서 짚을 어휘가 없습니다.","No vocabulary to flag in this sentence.")}</div>`;

  }

}
function placePanel(){
  const pn=$("#rpanel"); if(!pn) return; const st=$(".stage").getBoundingClientRect(), cu=$(".rs.cur"); let top=false;
  if(cu){ const r=cu.getBoundingClientRect(); top=(r.top+r.bottom)/2 > (st.top+st.bottom)/2; }

/* timer (전체 슬라이드에서 쓰는 공용 타이머) */
function curSlide(){ const p=getP(S.cur.pid); return p?(p.slides||[])[S.cur.idx]:null; }
function fmtT(sec){ sec=Math.ceil(sec); return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0"); }
function gtOn(){ return !!S.gtm && !S.gtm.off; }
function gtSecs(){ if(!gtOn()) return 0; return (S.gtm.run && S.gtEnd) ? Math.max(0,(S.gtEnd-Date.now())/1000) : S.gtm.sec; }
function tmrSecs(sl){ return gtOn() ? gtSecs() : (parseFloat(sl.minutes)||2)*60; }
function gtApply(){ const m=S.gtm; if(!m||m.off){ S.gtEnd=null; S.gtDone=false; return; } if(m.at!==S.gtAt){ S.gtAt=m.at; S.gtEnd=m.run?Date.now()+m.sec*1000:null; S.gtDone=false; } }

function gtCmd(cmd,arg){

    let sec=gtSecs(), total=gtOn()?S.gtm.total:0, run=gtOn()?S.gtm.run:false;

    else if(cmd==="pause"){ run=false; }
    else if(cmd==="add"){ sec=Math.max(0,sec+arg); total=Math.max(total,sec); }

}
function tmCmd(cmd){ const sl=curSlide(), def=((sl&&sl.type==="task"?parseFloat(sl.minutes):0)||2)*60; if(cmd==="go") gtCmd("go",def); else if(cmd==="pause") gtCmd("pause"); else gtCmd("reset"); }

function parsePayload(text){
  const t=String(text||"").replace(/^\uFEFF/,"").trim(); if(!t) throw new Error("붙여 넣은 내용이 없습니다");
  let j; try{ j=JSON.parse(t); }catch(e){ throw new Error("분석기의 ‘수업 보드용 복사’ 내용이 아닙니다"); }
  const items=Array.isArray(j)?j:(Array.isArray(j.items)?j.items:(j.passage?[j]:null));
  if(!items||!items.length) throw new Error("가져올 지문이 없습니다");
  return items.filter(x=>x && x.passage);
}

let fitT=null;
function fitAll(){
  const stage=$(".stage"), box=stage && $(".fit-box",stage); if(!box) return;
  { const sl0=curSlide(); if(sl0 && sl0.type==="note" && NOTE_SIZE[sl0.size]){ box.style.fontSize=(NOTE_SIZE[sl0.size]*(innerWidth<760?.5:1)*S.scale)+"px"; return; } }
  const cs=getComputedStyle(stage), pc=getComputedStyle(box.parentElement), avail=stage.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-parseFloat(pc.paddingTop)-parseFloat(pc.paddingBottom)-14;
  const small=innerWidth<760, min=small?15:(innerHeight<1000?15:20); const cap=SIZE_CAP[(curSlide()||{}).size]; let lo=min, hi=small?30:Math.min(cap||78, box.querySelector('.flow')?46:78), best=min; if(cap && !small) hi=cap; if(box.classList.contains('note') && !cap) hi=Math.min(hi,small?24:50); if(hi<lo) lo=hi;
  while(hi-lo>0.5){ const mid=(lo+hi)/2; box.style.fontSize=mid+"px"; if(box.scrollHeight<=avail){ best=mid; lo=mid; } else hi=mid; }
  box.style.fontSize=(best*S.scale)+"px";
  if(S.keepScroll!=null){ stage.scrollTop=S.keepScroll; S.keepScroll=null; }
  const cu=$(".rs.cur");
  if(cu){ const sr=stage.getBoundingClientRect(), rects=cu.getClientRects(); if(rects.length){ const top=rects[0].top, bot=rects[rects.length-1].bottom, pad=16;
    if(top<sr.top+pad) stage.scrollTop-= (sr.top+pad-top); else if(bot>sr.bottom-pad) stage.scrollTop+= Math.min(bot-(sr.bottom-pad), top-(sr.top+pad)); } }
}
window.addEventListener("resize",()=>{ clearTimeout(fitT); fitT=setTimeout(()=>{ fitAll(); placePanel(); initAnn(); },120); });

function readForm(target){
  const sl = S.draft.slides[S.editIdx]; if(!sl) return;
  const f = target.dataset.f, r = target.dataset.r;
  if(f){
    if(target.type==="checkbox"){ sl[f]=target.checked; markDirty(); renderSlideList(); return; }
    const v = target.value;
    if(f==="paras") sl.paras = v.split(/\n\s*\n/).map(x=>x.replace(/\s*\n\s*/g," ").trim()).filter(Boolean);
    else if(f==="vocabText") sl.items = v.split("\n").map(l=>l.split("|").map(x=>x.trim())).filter(a=>a[0]).map(a=>({w:a[0],m:a[1]||"",x:a.slice(2).join(" | ")}));
    else if(f==="bgText") sl.items = v.split("\n").map(x=>x.trim()).filter(Boolean);
    else if(f==="answer") sl.answer = +v;
    else if(f==="thesisN") sl.thesisN = v?+v:null;
    else sl[f]=v;
  } else if(r){
    const [list,i,key] = r.split("|");
    if(list==="memos"){ sl.memos=sl.memos||{}; sl.memos[+i]=target.value; markDirty(); return; }
    if(list==="xpts"){ sl.xpts=sl.xpts||{}; sl.xpts[+i]=target.value.split("\n").map(x=>x.trim()).filter(Boolean); markDirty(); return; }
    sl[list] = sl[list]||[];
    if(list==="choices"){ sl.choices[+i]=target.value; }
    else {
      sl[list][+i] = sl[list][+i]||{};
      if(key==="thesis") sl[list][+i][key]=target.checked;
      else if(key==="points") sl[list][+i][key]=target.value.split("\n").map(x=>x.trim()).filter(Boolean);
      else sl[list][+i][key]=target.value;
    }
  }
  markDirty();
}
function newSlide(type){
  const base={id:uid(), type, title:""};
  if(type==="note"){ base.title="판서"; base.body=""; }
  if(type==="text") base.paras=[];
  if(type==="structure"){ base.blocks=[{label:"도입",span:"",ko:""}]; }
  if(type==="vocab") base.items=[];
  if(type==="sentence") base.items=[{en:"",ko:"",points:[]}];
  if(type==="question"){ base.choices=["","","","",""]; base.answer=0; base.stem="다음 글의 주제로 가장 적절한 것은?"; }
  if(type==="translate"){ base.pairs=[]; }
  if(type==="background") base.items=[];
  if(type==="reading"){ base.title="문장 읽기"; base.memos={}; base.xpts={}; }
  if(type==="task"){ base.title="문제를 풀어 보세요"; base.minutes=2; base.body=""; }
  if(type==="draw"){ base.title="그림판"; base.body=""; }
  if(type==="free"){ base.title=""; base.body=""; }
  return base;
}
async function saveDraft(){
  if(!S.draft || S.saving) return;
  S.saving=true; const st=$("#savest"); if(st) st.textContent="저장 중…";
  const {id, ...body} = S.draft;
  try{
    await API.put("passages", id, JSON.parse(JSON.stringify(body)));
    S.dirty=false; if($("#savest")) $("#savest").textContent="저장됨"; toast("저장했습니다");
    const ix=S.passages.findIndex(p=>p.id===id), copy=JSON.parse(JSON.stringify({id,...body})); if(ix>=0) S.passages[ix]=copy; else S.passages.push(copy);
  }catch(e){
    if($("#savest")) $("#savest").textContent="저장 실패";
    if(e.status===401){ toast("로그인이 끝났습니다. 다시 로그인한 뒤 저장하세요 (수정 내용은 화면에 남아 있습니다)"); S.sheet="login"; renderAdmin(); return void(S.saving=false); }
    toast(e.message||"저장하지 못했습니다. 잠시 뒤 다시 눌러 주세요.");
  }
  S.saving=false;
}

    if(!S.isAdmin){ S.pendCls=c; S.sheet=null; render(); clearTimeout(S.homeT); S.homeT=setTimeout(()=>{ if(S.pendCls===c && !S.isAdmin){ S.sheet="teacher"; render(); } },wait); return; }

    case "a-clear": return annClear();
    case "a-min": S.annMin=!S.annMin; toast(S.annMin?"필기 멈춤":"필기 켜짐"); return render();
    case "setboard": try{ localStorage.setItem("cb_board","1"); }catch(x){} toast("칠판으로 지정했습니다. 새로고침하면 적용됩니다"); return;
    case "unboard": try{ localStorage.removeItem("cb_board"); }catch(x){} toast("지정을 풀었습니다. 새로고침하면 적용됩니다"); return;
    case "close": S.drawer=false; S.sheet=null; stopPairPoll(); return render();
    case "prev": return step(-1);
    case "next": return step(1);
    case "smaller": S.sheet=null; return setScale(S.scale-.1);
    case "bigger": S.sheet=null; return setScale(S.scale+.1);
    case "full": S.sheet=null; render(); try{ document.fullscreenElement? document.exitFullscreen() : await document.documentElement.requestFullscreen(); }catch(err){ toast("브라우저 메뉴의 전체 화면을 써 주세요"); } return;
    case "teacher": S.sheet="teacher"; return render();
    case "pair": return startPair();
    case "pwopen": S.loginTo=(innerWidth<760)?"admin":"class"; S.sheet="login"; render(); setTimeout(()=>$("#pw")?.focus(),50); return;
    case "pwclass": S.loginTo="class"; S.sheet="login"; render(); setTimeout(()=>$("#pw")?.focus(),50); return;
    case "pwlogin": S.loginTo="admin"; S.sheet="login"; render(); setTimeout(()=>$("#pw")?.focus(),50); return;
    case "dologin": {
      const pw=$("#pw").value, err=$("#pwerr");
      try{ const r=await API.req("POST","/api/login",{password:pw, remember:$("#remember").checked}); API.setToken(r.token,$("#remember").checked); }
      catch(x){ err.textContent = x.status===401 ? "비밀번호가 맞지 않습니다." : (x.message||"로그인하지 못했습니다."); return; }
      if(S.mode==="admin"){ S.sheet=null; S.isAdmin=true; render(); toast("다시 로그인했습니다. 저장을 눌러 주세요"); return; }
      S.sheet=null; await afterLogin(S.pendingPair ? "admin" : (S.loginTo||"admin")); return;
    }
    case "exitadmin": return exitAdmin();
    case "answer": return setReveal({answer:!S.reveal.answer});
    case "unlock": { const c=$("#pcode").value.trim(); if(!/^\d{4}$/.test(c)){ toast("4자리 번호를 넣어 주세요"); return; } try{ await API.req("POST","/api/pair/approve",{code:c}); toast("칠판을 열었습니다"); $("#pcode").value=""; }catch(x){ toast(x.message||"보내지 못했습니다"); } return; }
    case "save": return saveDraft();
    case "addunit": { const v=prompt("단원 이름 (예: 수프림 12과)"); if(!v||!v.trim()) return; const id=uid(); try{ await API.put("units",id,{title:v.trim(), order:S.units.length}); S.units.push({id,title:v.trim(),order:S.units.length}); renderTree(); }catch(x){ toast("만들지 못했습니다"); } return; }
    case "delp": { if(!confirm(`‘${S.draft.title}’ 지문을 지울까요? 되돌릴 수 없습니다.`)) return; const id=S.draft.id; await API.del("passages",id); S.passages=S.passages.filter(p=>p.id!==id); S.draft=null; S.editPid=null; S.dirty=false; renderAdminSide(true); return; }
    case "dupslide": { const c=JSON.parse(JSON.stringify(S.draft.slides[S.editIdx])); c.id=uid(); S.draft.slides.splice(S.editIdx+1,0,c); S.editIdx++; S.dirty=true; renderSlideList(); renderEditor(); return; }
    case "delslide": { if(!confirm("이 슬라이드를 지울까요?")) return; S.draft.slides.splice(S.editIdx,1); S.editIdx=Math.max(0,S.editIdx-1); S.dirty=true; renderSlideList(); renderEditor(); return; }
    case "fromtext": { const txt=(S.draft.slides||[]).find(s=>s.type==="text"); if(!txt){ toast("원문 슬라이드가 없습니다"); return; }
      const sl=S.draft.slides[S.editIdx]; const have=new Map((sl.pairs||[]).map(p=>[p.en,p.ko]));
      sl.pairs = (txt.paras||[]).flatMap(p=>splitSentences(p.replace(/\*\*|__/g,"")).map(s=>s.trim())).map(en=>({en, ko:have.get(en)||""}));
      S.dirty=true; $("#form").innerHTML=slideForm(sl); refreshPreview(); return; }
    case "showboard": { if(S.dirty) await saveDraft(); S.cur={pid:S.draft.id, idx:S.editIdx}; S.reveal={}; pushLive(); toast("칠판 화면을 이 슬라이드로 옮겼습니다"); return; }
    case "export": { try{ localStorage.setItem("cb_lastbk",String(Date.now())); }catch(x){} setTimeout(()=>{ if(S.mode==="admin") renderAdmin(); },300);
      const data={units:S.units, passages:S.passages, exportedAt:new Date().toISOString()};
      const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:"application/json"}));
      const d=new Date(); a.download=`수업보드백업_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
      document.body.appendChild(a); a.click(); a.remove(); return; }
    case "logoutall": if(!confirm("모든 기기를 로그아웃할까요?\n이 기기도 포함됩니다.")) return; try{ await API.req("POST","/api/logout-all"); API.setToken(""); try{localStorage.removeItem("cb_tok");}catch(e){} S.isAdmin=false; S.mode="class"; setLastMode("class"); toast("전체 로그아웃했습니다"); render(); }catch(x){ toast(x.message||"로그아웃하지 못했습니다"); } return;
    case "forget": await API.req("POST","/api/logout").catch(()=>{}); API.setToken(""); S.isAdmin=false; S.mode="class"; render(); toast("로그아웃했습니다"); return;
  }
});
document.addEventListener("input", e=>{
  const t=e.target;
  if(S.mode!=="admin" || !S.draft) return;
  if(t.dataset.pf){ S.draft[t.dataset.pf]=t.value; markDirty(); return; }
  if(t.dataset.f || t.dataset.r) readForm(t);
});
document.addEventListener("change", async e=>{
  const t=e.target;
  if(t.id==="themesel"){ S.evt=S.evt||{}; S.evt.theme=t.value; return evtSave(); }
  if(t.dataset && t.dataset.ev){ const [i,k]=t.dataset.ev.split("|"); S.evt=S.evt||{}; S.evt.events=S.evt.events||[]; S.evt.events[+i][k]=t.value; return; }
  if(t.id==="rpick"){ return go(t.value,0); }
  if(t.id==="pastefile" && t.files[0]){ const b=$("#pastebox"); if(b) b.value=await t.files[0].text(); return; }
  if(t.id==="pkn"){ S.pick.n=Math.max(2,Math.min(60,parseInt(t.value)||26)); t.value=S.pick.n; S.pick.hist=S.pick.hist.filter(x=>x<=S.pick.n); pickSave(); return; }
  if(t.id==="pkex"){ S.pick.excl=t.checked; pickSave(); return; }
  if(t.dataset && t.dataset.rvopt){ S.rv[t.dataset.rvopt]=t.checked; return; }
  if(t.dataset?.r && t.type==="checkbox") return readForm(t);
  if(t.dataset?.pf==="unitId"){ S.draft.unitId=t.value; markDirty(); return; }
  if(t.id==="importfile" && t.files[0]){
    try{ const d=JSON.parse(await t.files[0].text()); if(!Array.isArray(d.passages)) throw new Error("x");
      if(!confirm(`단원 ${(d.units||[]).length}개, 지문 ${d.passages.length}개로 바꿉니다. 지금 있는 자료는 지워집니다. 계속할까요?`)) return;
      await API.req("POST","/api/import",{units:d.units||[], passages:d.passages}); await loadData(); S.draft=null; S.editPid=null; S.cur={pid:allPassagesOrdered()[0]?.id||null, idx:0}; toast("불러왔습니다"); render();
    }catch(err){ toast("백업 파일을 읽지 못했습니다"); }
    t.value=""; return;
  }
  if(t.id==="imgfile" && t.files[0]){
    toast("이미지 올리는 중…");
    try{ const blob=await shrinkImage(t.files[0]); const r=await API.req("POST","/api/img",blob,true); const sl=S.draft.slides[S.editIdx]; sl.imgId=r.id; delete sl.src; const wasOut=!!sl.hidden; sl.hidden=false; markDirty(); renderSlideList(); $("#form").innerHTML=slideForm(sl); refreshPreview(); toast(wasOut?"올렸습니다. 칠판에도 넣었어요. 저장을 눌러 주세요":"올렸습니다. 저장을 눌러 주세요"); }
    catch(err){ toast(err.message||"이미지를 올리지 못했습니다"); }
  }
});
document.addEventListener("keydown", e=>{
  if(S.mode!=="class" || S.sheet) return;
  if(e.target.closest("input,textarea,select")) return;
  if(S.blank && S.isAdmin && ["ArrowRight","ArrowLeft","ArrowDown","ArrowUp","PageDown","PageUp"," ","Enter"].includes(e.key)){ e.preventDefault(); S.blank=false; pushLive(); toast("칠판을 다시 띄웠어요"); return render(); }
  if(!S.isAdmin || S.blank) return;
  if((e.ctrlKey||e.metaKey) && String(e.key).toLowerCase()==="z" && annActive()){ e.preventDefault(); annUndo(); return; }
  if(e.target.closest("button") && (e.key===" "||e.key==="Enter")) return;
  if(e.key==="ArrowRight"||e.key==="ArrowDown"||e.key==="PageDown"||e.key===" "){ e.preventDefault(); step(1); }
  if(e.key==="ArrowLeft"||e.key==="ArrowUp"||e.key==="PageUp"){ e.preventDefault(); step(-1); }
  { const sl=curSlide(), kk=String(e.key).toLowerCase();
    if(kk==="+"||kk==="="){ e.preventDefault(); return setScale(S.scale+.1); } if(kk==="-"){ e.preventDefault(); return setScale(S.scale-.1); }
    if(sl && (sl.type==="reading"||sl.type==="text") && S.reveal.sent>=0){ const k={"1":"ko","2":"vc","3":"gm","b":"ko",".":"ko"}[kk]; if(k){ e.preventDefault(); setReveal({[k]:!S.reveal[k]}); } }
    if(kk==="t"){ S.sheet="timer"; render(); } }
  if(e.key==="Escape"){ S.drawer=false; render(); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Tab" && e.target.dataset && e.target.dataset.tabok){ e.preventDefault(); const t=e.target, a=t.selectionStart, b=t.selectionEnd; t.value=t.value.slice(0,a)+"\t"+t.value.slice(b); t.selectionStart=t.selectionEnd=a+1; t.dispatchEvent(new Event("input",{bubbles:true})); return; } if(e.key==="Enter" && e.target.id==="pw") $("[data-act=dologin]")?.click(); if(e.key==="Enter" && e.target.id==="gpw") $("[data-act=gate-go]")?.click(); });
async function shrinkImage(file){
  if(file.size<900000 && /^image\/(png|jpeg|gif|webp)$/.test(file.type)) return file;
  const img=await createImageBitmap(file); const max=1800; const k=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
  for(const q of [0.85,0.75,0.6]){ const b=await new Promise(r=>c.toBlob(r,"image/jpeg",q)); if(b.size<1800000) return b; }
  throw new Error("이미지가 너무 큽니다");
}

/* ===== 끌어서 순서 바꾸기 (관리자 화면) ===== */
const SORTS=[
  {sel:".srow", key:"k", done:(order,moved)=>{ const d=S.draft; if(!d) return; const old=d.slides, cur=old[S.editIdx]; d.slides=order.map(i=>old[+i]); S.editIdx=Math.max(0,d.slides.indexOf(cur)); S.dirty=true; renderSlideList(); renderEditor(); toast("순서를 바꿨어요. 저장을 눌러 주세요"); }},
  {sel:".psort", key:"pid", done:async order=>{ for(let k=0;k<order.length;k++){ const p=getP(order[k]); if(p && p.order!==k){ p.order=k; const {id:pid2,...b}=p; try{ await API.put("passages",pid2,b); }catch(x){ toast("순서를 저장하지 못했습니다"); } if(S.draft && S.draft.id===pid2) S.draft.order=k; } } renderTree(); }},
  {sel:".usort", key:"uid", handle:".unit-h", done:async order=>{ for(let k=0;k<order.length;k++){ const u=S.units.find(x=>x.id===order[k]); if(u && u.order!==k){ u.order=k; const {id:uid2,...b}=u; try{ await API.put("units",uid2,b); }catch(x){ toast("순서를 저장하지 못했습니다"); } } } renderTree(); }}
];
document.addEventListener("pointerdown", e=>{
  if(S.mode!=="admin" || e.button) return;
  if(e.target.closest("input,textarea,select,.mini")) return;
  let cfg=null, it=null;
  for(const c of SORTS){ const x=e.target.closest(c.sel); if(x && (!c.handle || e.target.closest(c.handle))){ cfg=c; it=x; break; } }
  if(!cfg) return;
  if(e.pointerType!=="mouse" && !e.target.closest(".dh")) return;
  const sy=e.clientY, parent=it.parentElement; let drag=false;
  const mv=ev=>{
    if(!drag){ if(Math.abs(ev.clientY-sy)<6) return; drag=true; it.classList.add("dragging"); document.body.classList.add("sorting"); }
    ev.preventDefault();
    const sibs=[...parent.children].filter(x=>x!==it && x.matches(cfg.sel));
    let before=null; for(const x of sibs){ const r=x.getBoundingClientRect(); if(ev.clientY < r.top+r.height/2){ before=x; break; } }
    if(before){ if(it.nextElementSibling!==before) parent.insertBefore(it,before); }
    else if(sibs.length){ const last=sibs[sibs.length-1]; if(last.nextElementSibling!==it) last.after(it); }
  };
  const up=()=>{ removeEventListener("pointermove",mv); removeEventListener("pointerup",up); removeEventListener("pointercancel",up);
    if(!drag) return; it.classList.remove("dragging"); document.body.classList.remove("sorting"); S.justDragged=Date.now();
    const order=[...parent.children].filter(x=>x.matches(cfg.sel)).map(x=>x.dataset[cfg.key]);
    cfg.done(order); };
  addEventListener("pointermove",mv,{passive:false}); addEventListener("pointerup",up); addEventListener("pointercancel",up);
});

document.addEventListener("touchend",e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>80) step(dx<0?1:-1); },{passive:true});
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ if(!asleep){ lastAct=Date.now(); pollLive(); } } });

}

boot();
